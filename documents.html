document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".documents-container");
    documents.forEach(section => {
        const documentsBlock = document.createElement("div");
        documentsBlock.className = "documents";
        documentsBlock.style.marginTop = "50px";
        const title = document.createElement("p");
        title.className = "documents__title";
        title.textContent = section.title;
        documentsBlock.appendChild(title);
        section.items.forEach(item => {
            const icon = item.icon || "images/Document.svg";
            const link = document.createElement("a");
            link.className = "documents__item";
            if (!item.unavailable) {
                link.href = item.link;
            } else {
                link.style.cursor = "default";
            }
            if (item.itemprop) {
                link.setAttribute("itemprop", item.itemprop);
            }
            link.innerHTML = `
                <div class="documents__left">
                    <img src="${icon}" alt="table">
                    <span>${item.name}</span>
                </div>
                <span class="documents__action">${item.unavailable ? "Отсутствует" : "Открыть"}</span>
            `;
            documentsBlock.appendChild(link);
        });
        container.appendChild(documentsBlock);
    });
});
