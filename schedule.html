    body {
        margin: 0;

    }

    }
    .info {
        max-width: 100%;
        padding: 30px 21px 30px 15px;
    }
    .link-return {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 24px;
        color: black;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
    }
    .link-return__arrow {
        width: 28px;
        height: 28px;
    }
    .info__title {
        margin: 0 0 32px;
        font-family: "Inter Tight", sans-serif;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.1;
    }
    .schedule {
        margin-top: 36px;
    }
    .schedule__title {
        margin: 0 0 12px;
        font-size: 24px;
        font-weight: 600;
    }
    .schedule__item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 0;
        color: inherit;
        text-decoration: none;
        border-top: 1px solid #EAEAEA;
    }
    .schedule__item:last-child {
        border-bottom: 1px solid #EAEAEA;
    }
    .schedule__left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
    }
    .schedule__left span {
        font-size: 14px;
        line-height: 1.4;
    }
    .schedule__left img {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
    }
    .schedule__action {
        color: #FA5D20;
        font-size: 14px;
    }
    .link-return__title {
        font-size: 18px
    }
    .scroll-top {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 50px;
        height: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: black;
        border-radius: 50%;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
        z-index: 1;
    }
    .scroll-top.show {
        opacity: 1;
        pointer-events: auto;
    }
    .scroll-top img {
        width: 24px;
        height: 24px;
    }
    @media (min-width: 768px) {
        .info {
            padding: 30px 21px 30px 15px;
        }
        .title {
            font-size: 56px;
        }
        .item__title {
            font-size: 24px;
        }
        .item__text {
            font-size: 19px;
        }
        .schedule__left span {
            font-size: 17px;
        }
        .schedule__item {
            padding: 22px 0;
        }
    }
    @media (min-width: 1024px) {
        .info {
            padding: 50px 9.114vw;
        }
        .info__title {
            font-size: 40px;
        }
        .item__title {
            font-size: 24px;
        }
        .schedule__left span {
            font-size: 18px;
        }
        .schedule__item {
            padding: 24px 0;
        }
        .link-return__title {
            font-size: 18px
        }
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const scrollTop = document.getElementById("scrollTop");
        let timer;
        window.addEventListener("scroll", () => {
            if (window.scrollY > 50) {
                scrollTop.classList.add("show");
            }
            clearTimeout(timer);
            timer = setTimeout(() => {
                scrollTop.classList.remove("show");
            }, 1000);
        });
        scrollTop.addEventListener("click", () => {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        
        });
    });
</script>
